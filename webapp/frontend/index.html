<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Info</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Top progress bar for non-blocking loading feedback -->
  <div id="top-loader" class="top-loader"></div>

  <div id="app">
    <!-- SCREEN 1: DISCOVER -->
    <section id="screen-home" class="screen active">
      <header class="app-header">
        <div class="brand">
          <span class="brand-title">Anime Info</span>
        </div>
        <div id="user-greeting" class="user-greeting"></div>
      </header>

      <div class="search-container">
        <div class="search-box">
          <span class="search-icon">›</span>
          <input id="search-input" type="text" placeholder="Search anime by title..." autocomplete="off">
          <button id="search-clear" class="search-clear hidden">×</button>
        </div>
      </div>

      <!-- Search results view -->
      <div id="search-results-wrap" class="hidden">
        <div class="section-header">
          <span class="section-title">Search Results</span>
          <span id="search-count" class="section-meta"></span>
        </div>
        <div id="search-results" class="grid-layout"></div>
      </div>

      <!-- Default Home Sections -->
      <div id="home-content">
        <div class="section-header">
          <span class="section-title">Trending Titles</span>
          <span class="section-badge">Popular</span>
        </div>
        <div id="carousel" class="horizontal-scroll">
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
          <div class="skeleton-card"></div>
        </div>

        <div class="section-header">
          <span class="section-title">Your Watchlist</span>
          <span id="watchlist-count" class="section-meta"></span>
        </div>
        <div id="watchlist-home" class="grid-layout">
          <p class="status-msg">No titles added yet. Search or browse to add.</p>
        </div>
      </div>
    </section>

    <!-- SCREEN 2: BROWSE / CATALOG -->
    <section id="screen-catalog" class="screen">
      <header class="app-header">
        <div class="brand">
          <span class="brand-title">Catalog</span>
        </div>
      </header>

      <div class="filter-strip">
        <button class="filter-chip active" data-filter="trending">Trending</button>
        <button class="filter-chip" data-filter="new">New Releases</button>
        <button class="filter-chip" data-filter="popular">All-Time Popular</button>
      </div>

      <div id="catalog-content">
        <div class="loading-state">
          <div class="spinner-ring"></div>
          <span>Loading catalog...</span>
        </div>
      </div>
    </section>

    <!-- SCREEN 3: DETAIL VIEW -->
    <section id="screen-detail" class="screen">
      <div class="detail-top-nav">
        <button id="back-btn" class="nav-back-btn">‹ Back</button>
        <button id="detail-fav-quick" class="quick-fav-btn">☆</button>
      </div>
      <div id="detail-content"></div>
    </section>
  </div>

  <!-- Persistent Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" data-screen="home">
      <span class="nav-sym">●</span>
      <span class="nav-text">Discover</span>
    </button>
    <button class="nav-item" data-screen="catalog">
      <span class="nav-sym">≡</span>
      <span class="nav-text">Catalog</span>
    </button>
  </nav>

  <!-- Toast Notification Feedback -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>

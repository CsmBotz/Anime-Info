<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Anime Info</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ── SCREENS ── -->
  <div id="app">

    <!-- HOME -->
    <section id="screen-home" class="screen active">
      <div class="top-bar">
        <div class="top-bar-left">
          <span class="app-title">🎌 Anime Info</span>
        </div>
        <span id="user-greeting" class="greeting"></span>
      </div>

      <div class="search-wrap">
        <input id="search-input" type="text" placeholder="🔍 Search anime..." autocomplete="off">
      </div>

      <!-- Search Results (hidden by default) -->
      <div id="search-results-wrap" class="hidden">
        <h3 class="section-title">Results</h3>
        <div id="search-results" class="grid-3"></div>
      </div>

      <!-- Normal Home Content -->
      <div id="home-content">
        <h3 class="section-title">🔥 Trending</h3>
        <div id="carousel" class="carousel">
          <div class="skeleton-row">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>

        <h3 class="section-title">📋 Your Watchlist</h3>
        <div id="watchlist-home" class="grid-3">
          <p class="empty-msg">Loading...</p>
        </div>
      </div>
    </section>

    <!-- BROWSE / CATALOG -->
    <section id="screen-catalog" class="screen">
      <div class="filter-bar">
        <button class="chip active" data-filter="trending">🔥 Trending</button>
        <button class="chip" data-filter="new">🆕 New</button>
      </div>
      <div id="catalog-content">
        <div class="loading-spinner">Loading...</div>
      </div>
    </section>

    <!-- DETAIL VIEW -->
    <section id="screen-detail" class="screen">
      <button id="back-btn" class="back-btn">← Back</button>
      <div id="detail-content"></div>
    </section>

  </div>

  <!-- ── BOTTOM NAV ── -->
  <nav class="bottom-nav">
    <button class="nav-btn active" data-screen="home">
      <span class="nav-icon">🏠</span>
      <span class="nav-label">Home</span>
    </button>
    <button class="nav-btn" data-screen="catalog">
      <span class="nav-icon">📚</span>
      <span class="nav-label">Browse</span>
    </button>
  </nav>

  <!-- ── TOAST ── -->
  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>

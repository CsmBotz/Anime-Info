services:
  - type: web
    name: anime-info-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn webapp.backend.main:app --host 0.0.0.0 --port $PORT & python -m bot.main
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: USERS_MONGO_URI
        sync: false
      - key: BOT_MONGO_URI
        sync: false
      - key: CACHE_MONGO_URI
        sync: false
      - key: WEBAPP_URL
        sync: false

